services:
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_DB: heritage
      POSTGRES_USER: heritage
      POSTGRES_PASSWORD: heritage
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritage -d heritage"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://heritage:heritage@db:5432/heritage}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      UPLOAD_DIR: /app/uploads
      SAMPLE_DIR: /app/sample-data
      HF_HOME: /models/huggingface
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-facebook/nllb-200-distilled-600M}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    ports: ["8000:8000"]
    volumes: ["uploads:/app/uploads", "modelcache:/models", "../ml:/app/ml:ro"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=1
    environment:
      APP_ENV: ${APP_ENV:-development}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://heritage:heritage@db:5432/heritage}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      UPLOAD_DIR: /app/uploads
      SAMPLE_DIR: /app/sample-data
      HF_HOME: /models/huggingface
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-facebook/nllb-200-distilled-600M}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    volumes: ["uploads:/app/uploads", "modelcache:/models", "../ml:/app/ml:ro"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    init: true
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      HERITAGE_API_URL: ${HERITAGE_API_URL:-http://api:8000}
      HOSTNAME: 0.0.0.0
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_healthy}
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  pgdata:
  redisdata:
  uploads:
  modelcache:
