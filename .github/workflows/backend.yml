name: Backend tests
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ml/**"
      - "supabase/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "ml/**"
      - "supabase/**"
      - ".github/workflows/backend.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend/app ml
      - run: python -m pytest
        working-directory: backend
